name: ci

on:
  push:
  pull_request:

jobs:
  # The trusted core (Rust). Lives in envelope/.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envelope
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Formatting is a gate, not a suggestion.
      - name: format
        run: cargo fmt --all -- --check

      # Lints are errors. The trusted core does not merge with warnings.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  # Dependency CVEs in the core (RustSec advisory db).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: envelope

  # The untrusted brain (TypeScript). Lives in advisor/.
  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advisor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: advisor/.nvmrc
          cache: npm
          cache-dependency-path: advisor/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
